<style>
/* Layout: capa em cartão (painel verde com logo + foto). Abaixo, aviso e duas colunas no computador (Arquivos | Links); no celular tudo empilha.
   Identidade Grand Valley (e-book oficial): verde profundo, dourado, creme; Cormorant Garamond + Jost. Tema claro único, por escolha de marca. */
:root{
  --verde:#0B3327; --verde-2:#14473A; --verde-3:#1E5A49;
  --ouro:#C9A96E; --ouro-claro:#E6D4AC; --ouro-escuro:#9C7F48;
  --creme:#F4EFE6; --creme-2:#EAE2D3; --branco:#FFFFFF;
  --tinta:#1A2B25; --pedra:#5C6A63;
  --alerta:#A8262B; --alerta-2:#7F1A1F; --alerta-claro:#FBE3DF;
  --ok:#2F6B45; --ok-bg:#E8F1EA;
  --line:rgba(11,51,39,.12);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:26px}
.lbl{font-weight:500;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase}

/* ---------- Capa ---------- */
.capa{display:grid;grid-template-columns:minmax(0,1fr);border-radius:22px;overflow:hidden;background:var(--verde);box-shadow:0 22px 44px -26px rgba(11,51,39,.7)}
.painel{display:grid;align-content:center;justify-items:center;gap:16px;padding:30px 22px 26px;text-align:center;color:var(--creme)}
.gvlogo{width:min(230px,70%);height:auto;display:block}
.gvlogo .g-sym{fill:var(--ouro)} .gvlogo .g-word{fill:var(--creme)}
.painel .lbl{color:var(--ouro)}
.painel .fio{display:flex;align-items:center;gap:12px;color:var(--ouro)}
.painel .fio::before,.painel .fio::after{content:"";width:26px;height:1px;background:var(--ouro);opacity:.7}
.painel .loc{font-size:12.5px;letter-spacing:.06em;color:rgba(244,239,230,.75)}
.foto{position:relative;aspect-ratio:1672/941;max-width:100%;background:var(--verde-2)}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.foto .ilus{position:absolute;right:12px;bottom:10px;font-size:10px;letter-spacing:.08em;color:rgba(244,239,230,.8);text-shadow:0 1px 6px rgba(0,0,0,.6)}
@media (min-width:860px){
  .capa{grid-template-columns:minmax(0,5fr) minmax(0,8fr);min-height:380px}
  .painel{padding:40px 34px}
  .gvlogo{width:min(270px,80%)}
  .foto{aspect-ratio:auto}
  .foto::before{content:"";position:absolute;inset:0 auto 0 0;width:90px;z-index:1;background:linear-gradient(90deg,var(--verde),rgba(11,51,39,0))}
}

/* ---------- Aviso ---------- */
.aviso{display:grid;gap:10px;padding:22px 24px;border-radius:18px;background:linear-gradient(135deg,var(--alerta) 0%,var(--alerta-2) 100%);box-shadow:0 16px 30px -18px rgba(127,26,31,.85)}
.aviso .tag{display:inline-flex;align-items:center;gap:8px;color:var(--alerta-claro);font-weight:600}
.aviso .tag svg{width:17px;height:17px}
.aviso h1{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(25px,2.8vw,33px);line-height:1.15;color:var(--branco);text-wrap:balance}
.aviso h1 em{font-style:italic;font-weight:500;color:var(--alerta-claro)}

/* ---------- Seções ---------- */
.cols{display:grid;gap:30px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}}
.sec{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 2px}
.sec-h .fio{width:30px;height:1px;background:var(--ouro)}
.sec-h .lbl{color:var(--verde)}
.sec-d{margin:-4px 2px 2px;color:var(--pedra);font-size:13px}
.list{display:grid;gap:10px}

.item{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px 14px;align-items:center;padding:14px 14px 14px 16px;border-radius:16px;background:var(--branco);border:1px solid var(--line);
  transition:border-color .2s,box-shadow .2s}
.item:hover{border-color:var(--ouro);box-shadow:0 12px 26px -18px rgba(11,51,39,.55)}
.item .main-link{position:absolute;inset:0;border-radius:16px;z-index:0}
.item .main-link:focus-visible{outline:2px solid var(--verde);outline-offset:3px}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--creme);color:var(--verde);border:1px solid rgba(201,169,110,.45)}
.ic svg{width:21px;height:21px}
.txt{min-width:0;pointer-events:none}
.txt b{display:block;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.1;color:var(--verde)}
.txt small{display:block;margin-top:3px;font-size:12.5px;color:var(--pedra);line-height:1.35}
.acts{grid-column:2;position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px}
.mini{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--verde);
  font:500 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.mini svg{width:15px;height:15px;flex:none}
.mini:focus-visible{outline:2px solid var(--ouro);outline-offset:3px}
.mini.ghost{background:transparent;color:var(--verde)}
.mini.ghost:hover{background:var(--creme);border-color:var(--ouro)}
.mini.solid{background:var(--verde);color:var(--creme)}
.mini.solid svg{color:var(--ouro)}
.mini.solid:hover{background:var(--verde-3);border-color:var(--verde-3)}
.mini.wa{background:#25D366;color:#FFFFFF;border-color:#25D366;font-weight:600}
.mini.wa svg{color:#FFFFFF}
.mini.wa:hover{background:#1EBE5A;border-color:#1EBE5A}
.mini.ok{background:var(--ok-bg);color:var(--ok);border-color:rgba(47,107,69,.4)}
.mini.busy{opacity:.7;pointer-events:none}
.item.soon{background:transparent;border-style:dashed;border-color:rgba(11,51,39,.22)}
.item.soon:hover{border-color:rgba(11,51,39,.22);box-shadow:none}
.item.soon .ic{background:var(--creme-2);color:var(--pedra);border-color:transparent}
.item.soon .txt b{color:var(--pedra)}
.badge{grid-column:2;justify-self:start;display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:var(--creme-2);color:var(--pedra);font:500 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}

.fallback{grid-column:1/-1;position:relative;z-index:1;display:flex;gap:8px;align-items:center}
.fallback input{flex:1;min-width:0;font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--creme);color:var(--tinta)}
.fallback span{font-size:11.5px;color:var(--pedra);white-space:nowrap}

@media (max-width:460px){
  .item{grid-template-columns:42px minmax(0,1fr);padding:14px}
  .ic{width:42px;height:42px}
  .txt b{font-size:20px}
  .acts{grid-column:1/-1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
  .acts .mini{justify-content:center;padding:0 6px;gap:5px;font-size:9.5px;letter-spacing:.06em;min-height:40px}
  .acts .mini svg{width:14px;height:14px}
}

.dica{margin:0;padding:14px 16px;border-radius:14px;border:1px dashed rgba(201,169,110,.8);background:var(--branco);font-size:13px;color:var(--pedra);display:flex;gap:10px;align-items:flex-start}
.dica svg{width:18px;height:18px;flex:none;color:var(--ouro-escuro);margin-top:1px}

footer{padding-top:22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;font-size:12px;color:var(--pedra)}
footer .soc{display:flex;gap:10px;flex-wrap:wrap}
footer .soc a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px;border-radius:999px;background:var(--branco);border:1px solid var(--line);color:var(--verde);text-decoration:none;font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
footer .soc a:hover{border-color:var(--ouro)}
footer .soc a:focus-visible{outline:2px solid var(--verde);outline-offset:3px}
footer .soc svg{width:16px;height:16px}
footer .real{letter-spacing:.24em;text-transform:uppercase;font-size:10px}
footer .real b{font-weight:600;color:var(--verde)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;
  background:var(--verde);color:var(--creme);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:0 14px 30px -12px rgba(11,51,39,.7);transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<style>
/* Galeria: mesma identidade da página principal. */
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:20px;background:var(--verde);color:var(--creme)}
.topo .gvlogo{width:150px;height:auto}
.voltar{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(201,169,110,.6);color:var(--creme);text-decoration:none;font:500 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase}
.voltar:hover{background:var(--verde-2)}
.voltar:focus-visible{outline:2px solid var(--ouro);outline-offset:3px}
.g-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.g-head h1{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1.05;color:var(--verde)}
.g-head h1 em{font-style:italic;font-weight:400;color:var(--ouro-escuro)}
.g-head p{margin:6px 0 0;color:var(--pedra);font-size:13.5px}
.aviso.mini-aviso{padding:14px 18px;gap:6px}
.aviso.mini-aviso p{margin:0;color:var(--branco);font-family:var(--serif);font-size:20px;line-height:1.2}
.aviso.mini-aviso p em{font-style:italic;color:var(--alerta-claro)}
.grade{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:620px){.grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
.foto-card{margin:0;display:grid;grid-template-rows:auto auto;border-radius:16px;overflow:hidden;background:var(--branco);border:1px solid var(--line)}
.foto-card .thumb{display:block;aspect-ratio:16/10;max-width:100%;background:var(--creme-2);overflow:hidden}
.foto-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.foto-card .thumb:hover img{transform:scale(1.03)}
.foto-card .thumb:focus-visible{outline:2px solid var(--verde);outline-offset:-4px}
.foto-card figcaption{display:grid;gap:10px;padding:12px 14px 14px}
.foto-card .cap{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.15;color:var(--verde)}
.foto-card .cap small{display:block;font-family:var(--sans);font-weight:400;font-size:11.5px;color:var(--pedra);margin-top:2px}
.foto-card .acts{grid-column:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.foto-card .acts .mini{justify-content:center}
.nota{margin:0;font-size:12px;color:var(--pedra);text-align:center}
@media (prefers-reduced-motion:reduce){.foto-card .thumb img{transition:none}}
</style>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var toast=document.getElementById("toast"),tm;
  function say(m,ms){toast.textContent=m;toast.classList.add("on");clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove("on")},ms||2600);}
  var cache={};
  function getBlob(src){
    if(cache[src])return Promise.resolve(cache[src]);
    return fetch(src).then(function(r){if(!r.ok)throw new Error("http");return r.blob();}).then(function(b){cache[src]=new Blob([b],{type:"image/jpeg"});return cache[src];});
  }
  function canShareFiles(){
    try{return !!(navigator.canShare&&navigator.canShare({files:[new File([new Blob(["x"],{type:"image/jpeg"})],"t.jpg",{type:"image/jpeg"})]}));}catch(e){return false;}
  }
  /* Baixar: o link já tem o atributo download; aqui só avisamos. */
  document.querySelectorAll(".js-img-dl").forEach(function(a){a.addEventListener("click",function(){say("Baixando a foto…");});});
  /* WhatsApp: envia a própria imagem pela janela de compartilhar do celular. */
  document.querySelectorAll(".js-img-share").forEach(function(btn){
    var label=btn.querySelector("span");
    btn.addEventListener("click",function(){
      var src=btn.getAttribute("data-src"),name=btn.getAttribute("data-name");
      if(!canShareFiles()){say("Neste aparelho não dá para enviar a foto direto. Use “Baixar” e anexe no WhatsApp.",5000);return;}
      function share(b){
        return navigator.share({files:[new File([b],name,{type:"image/jpeg"})]})
          .then(function(){label.textContent="WhatsApp";})
          .catch(function(err){
            if(err&&err.name==="AbortError"){label.textContent="WhatsApp";return;}
            label.textContent="Toque p/ enviar";say("Foto pronta. Toque de novo em “Toque p/ enviar”.",4000);
          });
      }
      if(cache[src]){share(cache[src]);return;}
      btn.classList.add("busy");label.textContent="Preparando…";
      getBlob(src).then(function(b){btn.classList.remove("busy");return share(b);})
        .catch(function(){btn.classList.remove("busy");label.textContent="WhatsApp";say("Não foi possível preparar a foto. Tente de novo.",4000);});
    });
  });
})();
</script>
